
name: studio-nuxt-build
run-name: studio nuxt build

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - 'main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The deploy pushes to Cloudflare, not to a branch in this repo.
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: portfolio

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify package manager
        id: pkgman
        run: |
          cache=`[ -f "portfolio/pnpm-lock.yaml" ] && echo "pnpm" || ([ -f "portfolio/package-lock.json" ] && echo "npm" || ([ -f "portfolio/yarn.lock" ] && echo "yarn" || echo ""))`
          package_manager=`[ ! -z "$cache" ] && echo "$cache" || echo "pnpm"`
          echo "cache=$cache" >> $GITHUB_OUTPUT
          echo "package_manager=$package_manager" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: ${{ steps.pkgman.outputs.package_manager == 'pnpm' }}
        name: Install pnpm
        id: pnpm-install

      - uses: actions/setup-node@v4
        with:
          version: ${{ matrix.node }}
          cache: ${{ steps.pkgman.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pkgman.outputs.package_manager }} install

      # The Cloudflare preset lives in nuxt.config.ts so local and CI builds
      # produce the same output.
      - name: Generate
        run: npx nuxi build
        env:
          NUXT_CONTENT_PREVIEW_API: https://api.nuxt.studio

      # No deploy step: releases are cut locally with `pnpm deploy` (nuxt build
      # && wrangler deploy). This job exists to catch a broken build on main,
      # which is why it needs no Cloudflare credentials.
